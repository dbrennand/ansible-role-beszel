---
# defaults file for dbrennand.beszel
# Allowed beszel_state values
_beszel_states:
  - present
  - absent
# State of the Beszel binary agent installation
beszel_state: present
# Whether to fully automatically deploy the Beszel binary agent
beszel_auto_deploy: false
# Version of the Beszel binary agent to install
# Can be a specific version from GitHub (e.g., v0.9.1)
beszel_version: latest
# Port for the Beszel binary agent to listen on
beszel_port: 45876
# Public key used to authenticate the Beszel binary agent to the Hub
beszel_public_key: ""
# Directory to install the Beszel binary agent into
beszel_install_dir: /usr/local/bin
# Name of the user to create and run the Beszel binary agent as
beszel_user: beszel
# Custom arguments for the Beszel binary agent
beszel_args: ""
# Enable the Beszel binary agent systemd service on boot
beszel_service_enabled: true
# State of the Beszel binary agent systemd service
beszel_service_state: started
# Extra filesystems to be monitored by the Beszel binary agent
beszel_extra_filesystems: []
# -- Just needed if beszel_auto_deploy is true --
# URL to the Beszel Hub - https://beszel.example.com
beszel_hub_url: ""
# Domain to register the Beszel binary agent with - example.com
beszel_domain: ""
# List of users to register with the Beszel binary agent
# This should match the user IDs in the Beszel Hub
beszel_users:
  - ""
# API token for the Beszel Hub
beszel_api_token: ""

